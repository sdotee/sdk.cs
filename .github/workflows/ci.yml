name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore See.DotNet.Sdk.slnx --locked-mode
      - name: Check formatting
        run: dotnet format See.DotNet.Sdk.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build See.DotNet.Sdk.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test See.DotNet.Sdk.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Pack
        run: dotnet pack src/See.Sdk/See.Sdk.csproj --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
